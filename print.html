<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Koolunkle 포트폴리오</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="print-page">
    <div class="print-toolbar">
      <p class="print-toolbar-text">
        About과 모든 프로젝트를 한 문서로 모은 인쇄용 페이지입니다. 인쇄 창에서

      </p>
      <div class="print-toolbar-actions">
        <a class="btn btn-secondary" href="about.html">About으로</a>
        <button class="btn btn-primary" type="button" id="printButton">PDF로 저장</button>
      </div>
    </div>

    <div class="print-doc" id="printRoot">
      <p class="print-loading">불러오는 중입니다…</p>
    </div>

    <script src="js/projects-data.js"></script>
    <script src="js/project-render.js"></script>
    <script src="js/print.js"></script>
